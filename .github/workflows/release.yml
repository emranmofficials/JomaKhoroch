name: Android CI & Official GitHub Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0 — leave blank to use app versionName)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish or update GitHub Release with APK'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-ci-release-${{ github.event_name == 'pull_request' && github.head_ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-release:
    name: Test, Build & Release JomaKhoroch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Resolve release version and tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          APP_VERSION=$(grep -E 'versionName[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          APP_VERSION="${APP_VERSION:-1.0.0}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${APP_VERSION}"
          fi
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG} (versionName: ${APP_VERSION})"

      - name: Prepare signing keystores
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -s debug.keystore ]; then
            if [ -s debug.keystore.base64 ]; then
              tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          UPLOAD_KEYSTORE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$UPLOAD_KEYSTORE"
            echo "KEYSTORE_PATH=${UPLOAD_KEYSTORE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "signing_mode=custom" >> "$GITHUB_OUTPUT"
            echo "Using custom release keystore from GitHub Secrets."
          else
            cp debug.keystore "$UPLOAD_KEYSTORE"
            keytool -changealias \
              -keystore "$UPLOAD_KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -destalias upload
            echo "KEYSTORE_PATH=${UPLOAD_KEYSTORE}" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "signing_mode=default" >> "$GITHUB_OUTPUT"
            echo "Using repository signing keystore fallback for release APK."
          fi

      - name: Restore Firebase google-services.json (optional secret)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] && [ ! -s app/google-services.json ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secret."
          elif [ -s app/google-services.json ]; then
            echo "Using repository app/google-services.json."
          else
            echo "Note: app/google-services.json not present; building without bundled Firebase config."
          fi

      - name: Run core JVM unit tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.AccountingEngineTest" \
            --tests "com.example.PinSecurityTest" \
            --tests "com.example.AppUpdateCheckerTest"

      - name: Build Release APK, AAB & Debug APK
        env:
          GITHUB_RELEASE_REPO: ${{ github.repository }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease :app:assembleDebug

      - name: Stage release assets
        env:
          TAG: ${{ steps.meta.outputs.release_tag }}
        run: |
          mkdir -p release-assets
          RELEASE_APK=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -maxdepth 2 -name "*.aab" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" | head -n 1)

          if [ -z "$RELEASE_APK" ]; then
            echo "Error: Release APK was not generated."
            exit 1
          fi

          cp "$RELEASE_APK" "release-assets/JomaKhoroch-${TAG}-release.apk"
          if [ -n "$RELEASE_AAB" ]; then
            cp "$RELEASE_AAB" "release-assets/JomaKhoroch-${TAG}-release.aab"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release-assets/JomaKhoroch-${TAG}-debug.apk"
          fi

          (cd release-assets && sha256sum *.apk *.aab > SHA256SUMS.txt 2>/dev/null || sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JomaKhoroch-${{ steps.meta.outputs.release_tag }}-APKs
          path: release-assets/*
          if-no-files-found: error

      - name: Publish Official GitHub Release
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: "JomaKhoroch (জমাখরচ) ${{ steps.meta.outputs.release_tag }}"
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
